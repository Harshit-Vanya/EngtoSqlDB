version: '3.8'

services:
  # --- Primary Database (PostgreSQL) ---
  postgres-app:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Vector Database (ChromaDB) ---
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000" # Maps your requested local port 8001 to Chroma's default 8000
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  chromadata: