# Business Glossary — Maps business terms to database concepts
# Used by RAG to understand business language in user questions

terms:
  - term: "revenue"
    definition: "Total income from completed orders. Calculated as SUM(order_items.line_total) for orders with status 'completed'."
    related_tables: ["order_items", "orders"]
    related_columns: ["order_items.line_total", "orders.status"]
    synonyms: ["sales", "income", "earnings", "turnover"]
    category: "financial"

  - term: "average order value"
    definition: "Mean revenue per order. Calculated as total revenue divided by number of orders."
    related_tables: ["orders", "order_items"]
    related_columns: ["orders.total_amount"]
    synonyms: ["AOV", "avg order", "mean order value"]
    category: "financial"

  - term: "customer lifetime value"
    definition: "Total revenue generated by a single customer across all their orders."
    related_tables: ["customers", "orders", "order_items"]
    related_columns: ["customers.customer_id", "order_items.line_total"]
    synonyms: ["CLV", "LTV", "lifetime revenue", "total customer spend"]
    category: "customer"

  - term: "active customer"
    definition: "A customer who has placed at least one order in the last 90 days."
    related_tables: ["customers", "orders"]
    related_columns: ["customers.customer_id", "orders.order_date"]
    synonyms: ["recent customer", "engaged customer"]
    category: "customer"

  - term: "churn"
    definition: "Customers who have not placed an order in the last 180 days but previously had orders."
    related_tables: ["customers", "orders"]
    related_columns: ["customers.customer_id", "orders.order_date"]
    synonyms: ["churned", "lost customers", "inactive customers"]
    category: "customer"

  - term: "conversion rate"
    definition: "Percentage of orders that reach 'completed' status out of all orders placed."
    related_tables: ["orders"]
    related_columns: ["orders.status"]
    synonyms: ["completion rate", "fulfillment rate"]
    category: "operational"

  - term: "top products"
    definition: "Products ranked by total revenue (SUM of line_total from order_items)."
    related_tables: ["products", "order_items"]
    related_columns: ["products.product_name", "order_items.line_total"]
    synonyms: ["best sellers", "highest revenue products", "popular products"]
    category: "product"

  - term: "quarter"
    definition: "Standard fiscal quarter. Q1=Jan-Mar, Q2=Apr-Jun, Q3=Jul-Sep, Q4=Oct-Dec. Use date_trunc('quarter', date) in PostgreSQL."
    related_tables: ["orders"]
    related_columns: ["orders.order_date"]
    synonyms: ["Q1", "Q2", "Q3", "Q4", "fiscal quarter"]
    category: "time"

  - term: "last quarter"
    definition: "The most recently completed quarter before the current date. Calculate with: order_date >= date_trunc('quarter', CURRENT_DATE - INTERVAL '3 months') AND order_date < date_trunc('quarter', CURRENT_DATE)"
    related_tables: ["orders"]
    related_columns: ["orders.order_date"]
    synonyms: ["previous quarter", "prior quarter"]
    category: "time"

  - term: "year over year"
    definition: "Comparison of a metric between the same period in the current year vs the previous year."
    related_tables: ["orders"]
    related_columns: ["orders.order_date"]
    synonyms: ["YoY", "year-over-year", "annual comparison"]
    category: "time"

  - term: "premium customer"
    definition: "Customers with segment = 'Premium'. These are high-value customers."
    related_tables: ["customers"]
    related_columns: ["customers.segment"]
    synonyms: ["high-value customer", "VIP"]
    category: "customer"

  - term: "order fulfillment time"
    definition: "Number of days between order_date and shipped_date."
    related_tables: ["orders"]
    related_columns: ["orders.order_date", "orders.shipped_date"]
    synonyms: ["shipping time", "delivery time", "processing time"]
    category: "operational"

  - term: "cancellation rate"
    definition: "Percentage of orders with status 'cancelled' out of total orders."
    related_tables: ["orders"]
    related_columns: ["orders.status"]
    synonyms: ["cancel rate", "order cancellation percentage"]
    category: "operational"

  - term: "out of stock"
    definition: "Products where stock_quantity = 0."
    related_tables: ["products"]
    related_columns: ["products.stock_quantity"]
    synonyms: ["no inventory", "unavailable", "sold out"]
    category: "product"
